name: Close issues on merge to develop

# GitHub closes an issue named by "Closes #n" only when the PR merges into the default branch
# (main), and this repo's PRs merge into develop. This closes those issues instead, with a
# comment naming the PR, so a merge from GitHub mobile finishes the job
# (.claude/skills/issue-to-pr/SKILL.md, step 8).

# pull_request_target, so a merged fork PR gets a token that can close issues. It is safe here:
# nothing from the PR is checked out or run, and the body is only searched for issue numbers.
on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the PR closes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The body is read through the API, never interpolated into this script.
          body=$(gh pr view "$PR" --json body --jq .body)
          nums=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' <<< "$body" \
            | grep -oE '[0-9]+$' | sort -un)
          for n in $nums; do
            # Skip pull requests (they share the number space) and issues already closed.
            state=$(gh api "repos/$GH_REPO/issues/$n" --jq 'if .pull_request then "pr" else .state end' 2> /dev/null) || continue
            [ "$state" = open ] || continue
            gh issue close "$n" --comment "Fixed by #$PR, merged into \`develop\`. It ships with the next release." \
              || echo "::warning::could not close #$n"
          done
